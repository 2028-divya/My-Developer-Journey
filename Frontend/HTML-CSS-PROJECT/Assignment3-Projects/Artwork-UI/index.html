<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore Art Work</title>

    <link rel="stylesheet" href="style.css">

    <!-- Remix Icon -->
    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
        rel="stylesheet"
    >
</head>

<body>

    <div class="container">

        <!-- Decorative dots -->
        <div class="dot dot1"></div>
        <div class="dot dot2"></div>
        <div class="dot dot3"></div>
        <div class="dot dot4"></div>
        <div class="dot dot5"></div>
        <div class="dot dot6"></div>


        <!-- Heading -->
        <div class="heading">

            <h2>Explore Art Work</h2>

            <a href="#">See All</a>

        </div>


        <!-- Cards -->
        <div class="cards">


            <!-- Card 1 -->
            <div class="card">

                <img src="./Assets/img-1.jpg" alt="Monocular">

                <div class="info">

                    <p>Monocular</p>

                    <div class="price">
                        <span>54.8K</span>
                        <i class="ri-heart-line"></i>
                    </div>

                </div>

                <button>Place Bid</button>

            </div>


            <!-- Card 2 -->
            <div class="card">

                <img src="./Assets/img-2.jpg" alt="Horns Mask">

                <div class="info">

                    <p>Horns Mask</p>

                    <div class="price">
                        <span>32.4K</span>
                        <i class="ri-heart-line"></i>
                    </div>

                </div>

                <button>Place Bid</button>

            </div>


            <!-- Card 3 -->
            <div class="card">

                <img src="./Assets/img-3.jpg" alt="Light Moon">

                <div class="info">

                    <p>Light Moon</p>

                    <div class="price">
                        <span>86.6K</span>
                        <i class="ri-heart-line"></i>
                    </div>

                </div>

                <button>Place Bid</button>

            </div>


            <!-- Card 4 -->
            <div class="card">

                <img src="./Assets/img-4.jpg" alt="Skull Wire">

                <div class="info">

                    <p>Skull Wire</p>

                    <div class="price">
                        <span>78.9K</span>
                        <i class="ri-heart-line"></i>
                    </div>

                </div>

                <button>Place Bid</button>

            </div>


            <!-- Card 5 -->
            <div class="card">

                <img src="./Assets/img-5.jpg" alt="Spiderman">

                <div class="info">

                    <p>Spiderman</p>

                    <div class="price">
                        <span>24.8K</span>
                        <i class="ri-heart-line"></i>
                    </div>

                </div>

                <button>Place Bid</button>

            </div>


            <!-- Card 6 -->
            <div class="card">

                <img src="./Assets/img-6.jpg" alt="DeadPool">

                <div class="info">

                    <p>DeadPool</p>

                    <div class="price">
                        <span>59.7K</span>
                        <i class="ri-heart-line"></i>
                    </div>

                </div>

                <button>Place Bid</button>

            </div>


            <!-- Card 7 -->
            <div class="card">

                <img src="./Assets/img-7.png" alt="White Eye">

                <div class="info">

                    <p>White Eye</p>

                    <div class="price">
                        <span>45.7K</span>
                        <i class="ri-heart-line"></i>
                    </div>

                </div>

                <button>Place Bid</button>

            </div>


            <!-- Card 8 -->
            <div class="card">

                <img src="./Assets/img-8.jpg" alt="Plastic Spinal">

                <div class="info">

                    <p>Plastic Spinal</p>

                    <div class="price">
                        <span>98.6K</span>
                        <i class="ri-heart-line"></i>
                    </div>

                </div>

                <button>Place Bid</button>

            </div>

        </div>

    </div>

</body>
</html>
