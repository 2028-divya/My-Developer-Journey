<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon-UI</title>
    <link rel="stylesheet" href="style.css">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    rel="stylesheet"
/>
<link rel="shortcut icon" href="PickachuImg.png" type="image/x-icon">
</head>
<body>
    <div id="page-container">
        <div id="pokemon-card">
            <div id="card-container">
                <div id="card-left">
                    <div id="navbar">
                        <img id="pokemon-logo" src="./PokemonLogo.jpg" alt="">
                    </div>
                    <div id="pokemon-content">
                        <h6 id="pokemon-category">Pokemon GEN I</h6>
                        <h1 id="pokemon-title">Pikachu</h1>
                        <p id="pokemon-description">Pikachu is an Electric-type Pokémon introduced in Generation I. Pikachu are small, chubby, and incredibly cute mouse-like Pokémon. They are almost completely covered by yellow fur.</p>
                        <h6 id="page-number">
                            <span></span>
                            01 / 08</h6>
                    </div>
                    <div id="pikachu-image">
                        <img src="./PickachuImg.png" alt="pickachu">
                    </div>
                    <div id="pokeball-image">
                        <img src="./Pokeball.png" alt="">
                    </div>
                </div>
                <div id="card-right">

                    <i class="ri-menu-fill" id="menu-icon"></i>
                    <div id="page-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
